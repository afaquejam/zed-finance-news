<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance News — {{DATE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet" />
<style>
  /* ---------- Material Design 3 — dark by default, light on OS preference ---------- */
  :root {
    --md-sys-color-surface: #0e1116;
    --md-sys-color-surface-container-low: #161b22;
    --md-sys-color-surface-container: #1b212b;
    --md-sys-color-surface-container-high: #252d3a;
    --md-sys-color-surface-container-highest: #303a49;
    --md-sys-color-on-surface: #e3e8ef;
    --md-sys-color-on-surface-variant: #c0c8d4;
    --md-sys-color-outline: #8b94a3;
    --md-sys-color-outline-variant: #3a4250;
    --md-sys-color-primary: #5b9bff;
    --md-sys-color-on-primary: #002d6e;
    --md-sys-color-primary-container: #0a4bb0;
    --md-sys-color-on-primary-container: #d8e6ff;
    --md-sys-color-secondary-container: #243352;
    --md-sys-color-on-secondary-container: #d8e6ff;
    --finance-gain: #57d98a;
    --finance-loss: #ff8a9b;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --md-sys-color-surface: #fbfcff;
      --md-sys-color-surface-container-low: #f1f4fb;
      --md-sys-color-surface-container: #e9eef8;
      --md-sys-color-surface-container-high: #e3e9f4;
      --md-sys-color-surface-container-highest: #dde4f1;
      --md-sys-color-on-surface: #191c22;
      --md-sys-color-on-surface-variant: #414855;
      --md-sys-color-outline: #717988;
      --md-sys-color-outline-variant: #c1c8d6;
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d8e6ff;
      --md-sys-color-on-primary-container: #001a41;
      --md-sys-color-secondary-container: #dce6ff;
      --md-sys-color-on-secondary-container: #101d34;
      --finance-gain: #0f7a3d;
      --finance-loss: #c4183c;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    font-family: "Roboto Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-optical-sizing: auto;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 840px; margin: 0 auto; padding: 0 16px 56px; }

  /* ---------- Top app bar ---------- */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--md-sys-color-surface);
    padding: 28px 0 12px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .app-bar-inner { max-width: 840px; margin: 0 auto; padding: 0 16px; }
  .eyebrow {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--md-sys-color-primary);
    margin: 0 0 4px;
  }
  h1 {
    font-size: clamp(1.75rem, 4vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--md-sys-color-on-surface);
  }
  h1 .date { color: var(--md-sys-color-primary); }

  /* ---------- 7-day nav (MD3 chips) ---------- */
  nav.day-nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 0 4px;
    margin: 0 0 8px;
    scrollbar-width: none;
  }
  nav.day-nav::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
    padding: 8px 14px;
    border-radius: 16px;
    border: 1px solid var(--md-sys-color-outline-variant);
    background: transparent;
    color: var(--md-sys-color-on-surface-variant);
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .day-chip:hover { background: var(--md-sys-color-surface-container-high); }
  .day-chip .dow { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .day-chip .dom { font-size: 0.9375rem; font-weight: 600; white-space: nowrap; }
  .day-chip.active {
    background: var(--md-sys-color-primary-container);
    border-color: transparent;
    color: var(--md-sys-color-on-primary-container);
    pointer-events: none;
  }

  /* ---------- Section cards ---------- */
  section.brief-section {
    background: var(--md-sys-color-surface-container-low);
    border-radius: 24px;
    padding: 20px 24px 8px;
    margin-bottom: 16px;
  }
  section.brief-section h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: 0;
    margin: 0 0 4px;
    color: var(--md-sys-color-on-surface);
  }
  section.brief-section h2::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--md-sys-color-primary);
  }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    padding: 16px 0;
    border-top: 1px solid var(--md-sys-color-outline-variant);
  }
  ul.items li:first-child { border-top: none; }
  .detail {
    font-size: 1rem;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }
  .detail .emoji {
    display: inline-block;
    margin-right: 8px;
    font-size: 1.15em;
    line-height: 1;
    /* keep multicolor emoji from being tinted and align nicely */
    font-variant-numeric: normal;
  }
  .detail strong, .why strong, .cross-cutting strong {
    font-weight: 700;
    color: var(--md-sys-color-on-surface);
  }
  .why {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--md-sys-color-surface-container-high);
    font-size: 0.875rem;
    color: var(--md-sys-color-on-surface-variant);
    font-variant-numeric: tabular-nums;
  }
  .why-label {
    flex: 0 0 auto;
    color: var(--md-sys-color-primary);
    font-weight: 700;
    font-size: 0.6875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .source { margin-top: 8px; font-size: 0.75rem; }
  .source a {
    color: var(--md-sys-color-primary);
    text-decoration: none;
    font-weight: 500;
  }
  .source a:hover { text-decoration: underline; }

  /* ---------- Cross-cutting insight banner ---------- */
  .cross-cutting {
    display: flex;
    gap: 12px;
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    border-radius: 20px;
    padding: 18px 20px;
    margin-top: 24px;
    font-size: 0.9375rem;
  }
  .cross-cutting .ct-label {
    font-weight: 700;
    font-size: 0.6875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    padding-top: 2px;
  }
  footer {
    margin-top: 32px;
    color: var(--md-sys-color-outline);
    font-size: 0.75rem;
    text-align: center;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 600px) {
    .app-bar { padding-top: 20px; }
    .wrap { padding: 0 14px 40px; }
    .app-bar-inner { padding: 0 14px; }
    section.brief-section { padding: 16px 16px 4px; border-radius: 20px; }
    section.brief-section h2 { font-size: 1.25rem; }
    .cross-cutting { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
  <div class="app-bar">
    <div class="app-bar-inner">
      <p class="eyebrow">Daily Market Brief</p>
      <h1>Finance News: <span class="date">{{HEADER_DATE}}</span></h1>
    </div>
  </div>

  <div class="wrap">
    <nav class="day-nav" aria-label="Last 7 days">
      {{DAY_NAV}}
    </nav>

    {{SECTIONS}}

    {{CROSS_CUTTING}}

    <footer>Generated automatically by the finance-brief pipeline &middot; {{GENERATED_AT}}</footer>
  </div>
</body>
</html>
